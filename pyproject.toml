[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI bagimlilik enjeksiyonu varsayilan arguman olarak Depends(...) kullanir
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "fastapi.File", "fastapi.Form", "fastapi.Security", "app.core.deps.require_permission"]
